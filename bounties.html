<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chases — Buzaar Admin</title>
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <nav id="nav"></nav>

  <main id="content">
    <div class="page-title">Chases</div>
    <div class="page-subtitle" id="bounty-count">Loading…</div>

    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="active">Active</button>
      <button class="tab" data-tab="found">Found</button>
      <button class="tab" data-tab="all">All</button>
    </div>

    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="Search by item name or poster…">
    </div>

    <div id="pagination"></div>
    <div id="bounty-grid" class="chase-grid">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </main>

  <!-- Confirm deactivate modal -->
  <div class="modal-overlay" id="confirm-modal">
    <div class="modal">
      <div class="modal-title">Remove Chase?</div>
      <div class="modal-sub" id="confirm-item">This will deactivate the chase and hide it from the app.</div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-red" id="confirm-btn" onclick="confirmRemove()">Remove</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="./admin.js"></script>
  <script>
    const db = getDb();
    let allBounties = [], activeTab = 'active', removeTarget = null;
    const bountyNameMap = {};
    let currentPage = 1, pageSize = 10;

    (async () => {
      const admin = await requireAdmin();
      if (!admin) return;
      await renderNavWithBadges('bounties');
      await loadBounties();
    })();

    async function loadBounties() {
      const { data, error } = await db
        .from('bounties')
        .select(`
          id, item, category, price, condition, is_active, found, created_at, poster_id, event_name, bounty_type, photo,
          poster:profiles!poster_id(id, display_name, handle)
        `)
        .order('created_at', { ascending: false })
        .limit(500);

      if (error) {
        document.getElementById('bounty-count').textContent = 'Error loading chases: ' + error.message;
        return;
      }

      allBounties = data || [];
      document.getElementById('bounty-count').textContent = `${allBounties.length} chases total`;
      renderTable();
    }

    function getFiltered() {
      const q    = document.getElementById('search').value.toLowerCase();
      let list   = allBounties;

      if (activeTab === 'active') list = list.filter(b => b.is_active && !b.found);
      else if (activeTab === 'found') list = list.filter(b => b.found);

      if (q) list = list.filter(b => {
        const item   = (b.item || '').toLowerCase();
        const poster = (b.poster?.display_name || '').toLowerCase();
        return item.includes(q) || poster.includes(q);
      });

      return list;
    }

    function renderTable() {
      const grid = document.getElementById('bounty-grid');
      const list = getFiltered();

      if (list.length === 0) {
        grid.innerHTML = '<div class="empty-state"><h3>No chases found</h3></div>';
        renderPagination('pagination', 1, 1, 0, pageSize, 'gotoPage', 'setPageSize');
        return;
      }

      const pg = paginateList(list, currentPage, pageSize);
      currentPage = pg.page;
      renderPagination('pagination', pg.page, pg.totalPages, pg.total, pageSize, 'gotoPage', 'setPageSize');

      grid.innerHTML = pg.items.map(b => {
        bountyNameMap[b.id] = b.item || '';

        const statusBadge = b.found
          ? '<span class="badge badge-teal">✓ Found</span>'
          : b.is_active
            ? '<span class="badge badge-green">● Active</span>'
            : '<span class="badge badge-muted">Inactive</span>';

        const typeBadge = b.bounty_type === 'premium'
          ? '<span class="badge badge-yellow">🔥 Hot</span>'
          : b.bounty_type === 'open'
            ? '<span class="badge badge-primary">Open</span>'
            : '';

        const price    = b.price ? `₱${Number(b.price).toLocaleString()}` : null;
        const posterName = b.poster?.display_name || '?';
        const posterHandle = b.poster?.handle ? `@${b.poster.handle}` : '';
        const bg = avatarBg(posterName);

        return `
          <div class="chase-card">
            <div class="chase-photo">
              ${b.photo
                ? `<img src="${escHtml(b.photo)}" onclick="openLightbox('${escHtml(b.photo)}')" style="width:100%;height:100%;object-fit:cover;cursor:zoom-in">`
                : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--muted)">📦</div>`
              }
              <div class="chase-badges">
                ${statusBadge}
                ${typeBadge}
              </div>
            </div>
            <div class="chase-body">
              <div class="chase-title">${escHtml(b.item || '—')}</div>
              ${b.category ? `<div class="chase-category">${escHtml(b.category)}</div>` : ''}
              <div class="chase-meta-row">
                ${price ? `<span style="color:var(--yellow);font-weight:700;font-size:13px">${price}</span>` : ''}
                ${b.condition ? `<span class="badge badge-muted" style="font-size:10px">${escHtml(b.condition)}</span>` : ''}
              </div>
              ${b.event_name ? `<div class="chase-event">📅 ${escHtml(b.event_name)}</div>` : ''}
              <div class="chase-footer">
                <div class="user-cell" style="gap:7px">
                  <div class="avatar" style="width:26px;height:26px;font-size:11px;background:${bg}30;color:${bg}">${avatarInitial(posterName)}</div>
                  <div>
                    <div style="font-size:12px;font-weight:600">${escHtml(posterName)}</div>
                    ${posterHandle ? `<div style="font-size:11px;color:var(--muted)">${escHtml(posterHandle)}</div>` : ''}
                  </div>
                </div>
                <div style="font-size:11px;color:var(--muted)">${formatDate(b.created_at)}</div>
              </div>
              ${b.is_active && !b.found
                ? `<button class="btn btn-red btn-xs" style="width:100%;margin-top:10px" onclick="openRemove('${b.id}')">Remove</button>`
                : ''
              }
            </div>
          </div>
        `;
      }).join('');
    }

    function openRemove(id) {
      removeTarget = id;
      const name = bountyNameMap[id] || 'this chase';
      document.getElementById('confirm-item').textContent = `Remove "${name}"? This will deactivate it and hide it from all users.`;
      document.getElementById('confirm-modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('confirm-modal').classList.remove('open');
      removeTarget = null;
    }

    async function confirmRemove() {
      if (!removeTarget) return;
      const btn = document.getElementById('confirm-btn');
      btn.disabled = true;

      await db.from('bounties').update({ is_active: false }).eq('id', removeTarget);
      allBounties = allBounties.map(b => b.id === removeTarget ? { ...b, is_active: false } : b);

      closeModal();
      renderTable();
      showToast('Chase removed');
      btn.disabled = false;
    }

    function gotoPage(n)    { currentPage = n; renderTable(); }
    function setPageSize(n) { pageSize = parseInt(n); currentPage = 1; renderTable(); }

    document.getElementById('tabs').addEventListener('click', e => {
      const btn = e.target.closest('[data-tab]');
      if (!btn) return;
      activeTab = btn.dataset.tab;
      currentPage = 1;
      document.querySelectorAll('#tabs .tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      renderTable();
    });

    document.getElementById('search').addEventListener('input', () => { currentPage = 1; renderTable(); });

    document.getElementById('confirm-modal').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeModal();
    });
  </script>
</body>
</html>
