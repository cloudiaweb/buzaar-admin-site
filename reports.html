<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports — Buzaar Admin</title>
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <nav id="nav"></nav>

  <main id="content">
    <div class="page-title">Reports</div>
    <div class="page-subtitle" id="report-count">Loading…</div>

    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="pending">Pending <span id="pending-badge"></span></button>
      <button class="tab" data-tab="resolved">Resolved</button>
      <button class="tab" data-tab="dismissed">Dismissed</button>
    </div>

    <div id="list-area">
      <div class="loading"><div class="spinner"></div>Loading…</div>
    </div>
    <div id="pagination"></div>
  </main>

  <!-- Resolve modal -->
  <div class="modal-overlay" id="resolve-modal">
    <div class="modal">
      <div class="modal-title" id="resolve-title">Resolve Report</div>
      <div class="modal-sub" id="resolve-sub">Add an optional note about the action taken.</div>
      <div class="form-group">
        <label for="admin-note">Admin note (optional)</label>
        <textarea id="admin-note" placeholder="e.g. Removed the bounty, user warned…"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeResolveModal()">Cancel</button>
        <button class="btn btn-red btn-sm" onclick="resolveReport('dismissed')">Dismiss</button>
        <button class="btn btn-teal" onclick="resolveReport('resolved')">✓ Resolve</button>
      </div>
    </div>
  </div>

  <!-- Delete modal -->
  <div class="modal-overlay" id="delete-modal">
    <div class="modal">
      <div class="modal-title">Remove Content?</div>
      <div class="modal-sub">The content will be removed and the user will be notified with the report reason.</div>
      <div style="background:var(--surface2);border-radius:10px;padding:12px;margin-bottom:12px">
        <div style="font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px">Content</div>
        <div style="font-size:14px;font-weight:700" id="delete-content-name">—</div>
      </div>
      <div style="background:rgba(255,59,48,0.08);border:1px solid rgba(255,59,48,0.2);border-radius:10px;padding:12px;margin-bottom:4px">
        <div style="font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px">Reason sent to user</div>
        <div style="font-size:13px;color:var(--text)" id="delete-reason-text">—</div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeDeleteModal()">Cancel</button>
        <button class="btn btn-red" id="delete-confirm-btn" onclick="confirmDelete()">Remove &amp; Notify User</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="./admin.js"></script>
  <script>
    const db = getDb();
    let reports = [], activeTab = 'pending', resolveTarget = null, deleteTarget = null;
    let adminId = null;
    const mediaMap = {};
    let currentPage = 1, pageSize = 10;

    (async () => {
      const admin = await requireAdmin();
      if (!admin) return;
      adminId = admin.profile.id;
      await renderNavWithBadges('reports');
      await loadReports();
    })();

    async function loadReports() {
      showLoading(document.getElementById('list-area'));

      const { data, error } = await db
        .from('reports')
        .select(`
          id, reported_type:type, reported_id:target_id, reason, details, status, admin_note, created_at, resolved_at,
          reporter:profiles!reported_by(id, display_name, handle),
          resolver:profiles!resolved_by(id, display_name)
        `)
        .order('created_at', { ascending: false })
        .limit(200);

      if (error) {
        document.getElementById('list-area').innerHTML =
          '<div class="alert alert-red">Could not load reports. Make sure the reports table exists — see reports_migration.sql.</div>';
        return;
      }

      reports = data || [];
      const pending = reports.filter(r => r.status === 'pending').length;
      document.getElementById('report-count').textContent = `${reports.length} reports total`;
      document.getElementById('pending-badge').textContent = pending > 0 ? `(${pending})` : '';
      renderNav('reports', { reports: pending || undefined });

      await fetchReportMedia(reports);
      renderList();
    }

    async function fetchReportMedia(list) {
      const ids = (type) => [...new Set(list.filter(r => r.reported_type === type).map(r => r.reported_id).filter(Boolean))];
      const bountyIds  = ids('bounty');
      const profileIds = ids('profile');
      const eventIds   = ids('event');
      const offerIds   = ids('offer');

      const [bountyRes, profileRes, eventRes, offerRes] = await Promise.all([
        bountyIds.length  ? db.from('bounties').select('id, item, photo, category, price, poster_id').in('id', bountyIds) : { data: [] },
        profileIds.length ? db.from('profiles').select('id, display_name, handle, photo_url').in('id', profileIds) : { data: [] },
        eventIds.length   ? db.from('events').select('id, name, photo, date, location, organizer_id').in('id', eventIds) : { data: [] },
        offerIds.length   ? db.from('offers').select('id, price, currency, seller_id, bounty:bounties!bounty_id(item, photo)').in('id', offerIds) : { data: [] },
      ]);

      (bountyRes.data  || []).forEach(b => { mediaMap[b.id] = { type: 'bounty',  photo: b.photo,     label: b.item,  sub: b.category, price: b.price, ownerId: b.poster_id }; });
      (profileRes.data || []).forEach(p => { mediaMap[p.id] = { type: 'profile', photo: p.photo_url, label: p.display_name, sub: p.handle ? '@' + p.handle : '', ownerId: p.id }; });
      (eventRes.data   || []).forEach(e => { mediaMap[e.id] = { type: 'event',   photo: e.photo,     label: e.name,  sub: e.location || e.date, ownerId: e.organizer_id }; });
      (offerRes.data   || []).forEach(o => { mediaMap[o.id] = { type: 'offer',   photo: o.bounty?.photo, label: o.bounty?.item || 'Offer', sub: o.price ? `₱${Number(o.price).toLocaleString()}` : '', ownerId: o.seller_id }; });
    }

    function getFiltered() {
      return reports.filter(r => r.status === activeTab);
    }

    function typeLabel(type) {
      const map = { bounty: '🎯 Bounty', profile: '👤 Profile', event: '📅 Event', offer: '💬 Offer' };
      return map[type] || type;
    }

    function renderList() {
      const area = document.getElementById('list-area');
      const list = getFiltered();

      if (list.length === 0) {
        showEmpty(area,
          activeTab === 'pending' ? 'No pending reports' : 'Nothing here',
          activeTab === 'pending' ? 'All reports have been reviewed.' : ''
        );
        renderPagination('pagination', 1, 1, 0, pageSize, 'gotoPage', 'setPageSize');
        return;
      }

      const pg = paginateList(list, currentPage, pageSize);
      currentPage = pg.page;
      renderPagination('pagination', pg.page, pg.totalPages, pg.total, pageSize, 'gotoPage', 'setPageSize');

      area.innerHTML = pg.items.map(r => {
        const reporter = r.reporter
          ? `${r.reporter.display_name || '?'}${r.reporter.handle ? ' @' + r.reporter.handle : ''}`
          : 'Unknown';
        const resolver = r.resolver ? `by ${r.resolver.display_name}` : '';

        return `
          <div class="card" id="report-${r.id}">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px">
              <div>
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
                  <span style="font-weight:700;font-size:14px">${typeLabel(r.reported_type)}</span>
                  ${r.status === 'pending'
                    ? '<span class="badge badge-amber">Pending</span>'
                    : r.status === 'resolved'
                      ? '<span class="badge badge-teal">Resolved</span>'
                      : '<span class="badge badge-muted">Dismissed</span>'
                  }
                </div>
                <div style="color:var(--muted);font-size:12px">
                  Reported by <strong style="color:var(--text)">${reporter}</strong> · ${formatDateTime(r.created_at)}
                </div>
              </div>
            </div>

            ${mediaMap[r.reported_id] ? (() => {
                const m = mediaMap[r.reported_id];
                const icon = { profile: '👤', event: '📅', offer: '💬', bounty: '📦' }[m.type] || '📦';
                return `<div style="display:flex;align-items:center;gap:12px;background:var(--surface2);border-radius:10px;padding:10px;margin-bottom:10px;border:1px solid var(--border)">
                  ${m.photo
                    ? `<img src="${escHtml(m.photo)}" onclick="openLightbox('${escHtml(m.photo)}')" style="width:64px;height:64px;border-radius:10px;object-fit:cover;flex-shrink:0;border:1px solid var(--border);cursor:zoom-in">`
                    : `<div style="width:64px;height:64px;border-radius:10px;background:var(--surface);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:26px;border:1px solid var(--border)">${icon}</div>`
                  }
                  <div style="min-width:0">
                    <div style="font-size:13px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(m.label || '—')}</div>
                    ${m.sub ? `<div style="font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(m.sub)}</div>` : ''}
                    ${m.price ? `<div style="font-size:12px;color:var(--yellow);font-weight:600;margin-top:2px">₱${Number(m.price).toLocaleString()}</div>` : ''}
                  </div>
                </div>`;
              })() : ''}

            <div style="background:var(--surface2);border-radius:10px;padding:12px;margin-bottom:10px">
              <div style="font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px">Reason</div>
              <div style="font-size:13px">${escHtml(r.reason)}</div>
              ${r.details ? `<div style="color:var(--muted);font-size:12px;margin-top:6px">${escHtml(r.details)}</div>` : ''}
            </div>

            ${r.admin_note ? `
              <div style="background:rgba(108,99,255,0.08);border:1px solid rgba(108,99,255,0.2);border-radius:10px;padding:10px;margin-bottom:10px">
                <div style="font-size:11px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:3px">Admin note ${resolver}</div>
                <div style="font-size:13px;color:var(--text)">${r.admin_note}</div>
              </div>` : ''}

            ${r.status === 'pending' ? `
              <div class="btn-row">
                <button class="btn btn-red btn-sm" onclick="openDeleteModal('${r.id}')">🗑 Remove Content</button>
                <button class="btn btn-teal btn-sm" onclick="openResolveModal('${r.id}','resolve')">✓ Resolve</button>
                <button class="btn btn-ghost btn-sm" onclick="openResolveModal('${r.id}','dismiss')">Dismiss</button>
              </div>` : `
              <div style="color:var(--muted);font-size:12px">
                ${r.status === 'resolved' ? '✓ Resolved' : '— Dismissed'} ${formatDate(r.resolved_at)} ${resolver}
              </div>`
            }
          </div>
        `;
      }).join('');
    }

    function openResolveModal(reportId, action) {
      resolveTarget = { id: reportId, action };
      document.getElementById('resolve-title').textContent = action === 'resolve' ? 'Resolve Report' : 'Dismiss Report';
      document.getElementById('admin-note').value = '';
      document.getElementById('resolve-modal').classList.add('open');
    }

    function closeResolveModal() {
      document.getElementById('resolve-modal').classList.remove('open');
      resolveTarget = null;
    }

    async function resolveReport(status) {
      if (!resolveTarget) return;
      const note = document.getElementById('admin-note').value.trim();
      const now  = new Date().toISOString();

      const updateData = { status, admin_note: note || null, resolved_at: now };
      if (adminId) updateData.resolved_by = adminId;

      const { error } = await db.from('reports').update(updateData).eq('id', resolveTarget.id);
      if (error) {
        showToast('Failed to update report', 'error');
        closeResolveModal();
        return;
      }

      reports = reports.map(r => r.id === resolveTarget.id
        ? { ...r, status, admin_note: note || null, resolved_at: now }
        : r
      );

      closeResolveModal();
      renderList();
      showToast(status === 'resolved' ? 'Report resolved ✓' : 'Report dismissed');

      const pending = reports.filter(r => r.status === 'pending').length;
      document.getElementById('pending-badge').textContent = pending > 0 ? `(${pending})` : '';
    }

    function openDeleteModal(reportId) {
      const r = reports.find(x => x.id === reportId);
      if (!r) return;
      const m = mediaMap[r.reported_id] || {};
      deleteTarget = { reportId, type: r.reported_type, targetId: r.reported_id, ownerId: m.ownerId, reason: r.reason };
      document.getElementById('delete-content-name').textContent = m.label || r.reported_type || '—';
      document.getElementById('delete-reason-text').textContent  = r.reason || '—';
      document.getElementById('delete-modal').classList.add('open');
    }

    function closeDeleteModal() {
      document.getElementById('delete-modal').classList.remove('open');
      deleteTarget = null;
    }

    async function confirmDelete() {
      if (!deleteTarget) return;
      const btn = document.getElementById('delete-confirm-btn');
      btn.disabled = true;
      btn.textContent = 'Removing…';

      const { type, targetId, ownerId, reason, reportId } = deleteTarget;

      // Deactivate content
      if (type === 'bounty') {
        await db.from('bounties').update({ is_active: false }).eq('id', targetId);
      } else if (type === 'event') {
        await db.from('events').update({ is_active: false }).eq('id', targetId);
      }

      // Notify content owner
      if (ownerId) {
        const contentWord = { bounty: 'chase', event: 'event', offer: 'offer', profile: 'account' }[type] || type;
        const isProfile   = type === 'profile';
        await db.from('notifications').insert({
          user_id: ownerId,
          type: 'post_removed',
          read: false,
          data: {
            title: isProfile ? 'Account warning' : `Your ${contentWord} was removed`,
            body:  `${isProfile ? 'Your account received a flag' : `Your ${contentWord} was removed`} due to a report: "${reason}"`,
          },
        });
      }

      // Resolve the report
      const now = new Date().toISOString();
      const updateData = { status: 'resolved', admin_note: `Content removed. Reason: ${reason}`, resolved_at: now };
      if (adminId) updateData.resolved_by = adminId;

      const { error } = await db.from('reports').update(updateData).eq('id', reportId);
      if (error) { showToast('Failed to update report', 'error'); btn.disabled = false; btn.textContent = 'Remove & Notify User'; closeDeleteModal(); return; }

      reports = reports.map(r => r.id === reportId ? { ...r, ...updateData } : r);
      closeDeleteModal();
      renderList();
      showToast('Content removed and user notified');
      const pending = reports.filter(r => r.status === 'pending').length;
      document.getElementById('pending-badge').textContent = pending > 0 ? `(${pending})` : '';
      btn.disabled = false;
      btn.textContent = 'Remove & Notify User';
    }

    function gotoPage(n)    { currentPage = n; renderList(); }
    function setPageSize(n) { pageSize = parseInt(n); currentPage = 1; renderList(); }

    document.getElementById('tabs').addEventListener('click', e => {
      const btn = e.target.closest('[data-tab]');
      if (!btn) return;
      activeTab = btn.dataset.tab;
      currentPage = 1;
      document.querySelectorAll('#tabs .tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      renderList();
    });

    document.getElementById('resolve-modal').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeResolveModal();
    });

    document.getElementById('delete-modal').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeDeleteModal();
    });
  </script>
</body>
</html>
